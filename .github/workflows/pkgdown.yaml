# The pkgdown site, deployed from main and from each release. A pull request
# builds it only when labelled `full-ci`: CI minutes are limited, and a
# broken site shows on main's deploy. CLAUDE.md and AGENTS.md are kept off it; see
# https://github.com/pedrobtz/r-actions#pkgdownyml--the-site-without-the-agent-instructions
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

jobs:
  pkgdown:
    # Decided without a runner. On a pull request only with `full-ci`: the
    # site builds and deploys on every push to main, which is where a broken
    # build shows, and CI minutes are limited.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
    # Deploys queue rather than cancel one another; pull requests run apart.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    uses: pedrobtz/r-actions/.github/workflows/pkgdown.yml@v1
