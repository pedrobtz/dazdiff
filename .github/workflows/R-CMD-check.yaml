# Reusable R CMD check from https://github.com/pedrobtz/r-actions: the default
# runners, all with --as-cran, and the nosuggests leg (CRAN's NOSUGGESTS
# flavor). No R-hub compiler containers (clang23, ubuntu-clang, ubuntu-gcc16),
# in either profile: they check how compiled code builds, the package is pure
# R, and r-actions sets them to '[]' for exactly that case. CI minutes are
# limited, and clang23 was the second leg of every pull request.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "27 3 * * 6"
  workflow_dispatch:
  # `labeled` so that adding `full-ci` to a pull request reruns it in full.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: R-CMD-check

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on each push to a pull request (one Linux R-release leg), full
      # on the schedule, on dispatch, and with the `full-ci` label.
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
      containers: "[]"
      quick-containers: "[]"
      nosuggests: true
      # The shared default plus CRAN's Windows R-devel flavor, and R 4.1, the
      # floor DESCRIPTION declares. With no containers, the Linux R-devel row
      # comes back: nothing else checks on the R CRAN uses for new packages.
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "oldrel-1"},
         {"os": "ubuntu-latest", "r": "4.1"}]
